name: dotdart
description: Build-time Flutter asset compiler that generates typed, optimized widgets from SVG, Lottie, images, and GIFs for mobile, web, and desktop.
version: 0.11.1
homepage: https://github.com/Ventairy/dotdart
repository: https://github.com/Ventairy/dotdart
issue_tracker: https://github.com/Ventairy/dotdart/issues
documentation: https://github.com/Ventairy/dotdart/tree/main/doc
topics:
  - flutter
  - assets
  - codegen
  - lottie
  - svg

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  build: ^4.0.0
  dart_style: ^3.0.0
  flutter:
    sdk: flutter
  glob: ^2.1.3
  image: ^4.8.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=7.0.0 <11.0.0"
