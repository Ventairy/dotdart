name: dotdart_example
description: Runnable example for dotdart-generated SVG, Lottie, and image/GIF widgets.
publish_to: none

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  dotdart:
    path: ../
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

dotdart:
  output: lib/gen/
  svg:
    - assets/icons/
  lottie:
    - assets/lotties/
  image:
    - assets/images/

flutter:
  uses-material-design: true
  assets:
    - assets/images/
