<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#00ffff"/>
  <defs>
    <clipPath id="gate"><rect width="75" height="100"/></clipPath>
    <pattern id="tile" width="1" height="1" patternContentUnits="objectBoundingBox">
      <image href="data:image/png;base64," width="1" height="1" preserveAspectRatio="none"/>
    </pattern>
  </defs>
  <mask id="mask" x="10" y="10" width="80" height="70" maskUnits="userSpaceOnUse">
    <path fill="#fff" d="M0 0H100V100H0Z"/>
